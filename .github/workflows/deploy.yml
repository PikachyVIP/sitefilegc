name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          : "${SSH_HOST:?SSH_HOST secret is required}"
          : "${SSH_USER:?SSH_USER secret is required}"
          : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY secret is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy code with rsync
        run: |
          rsync -az --delete --delay-updates \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.githooks/' \
            --exclude='deploy/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='uploads/' \
            --exclude='updates/' \
            --exclude='bin/' \
            --exclude='configfile.ini' \
            --exclude='*.log' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Install converter media tools
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
          set -eu
          cd "$DEPLOY_PATH"
          mkdir -p bin
          if [ ! -x bin/ffmpeg ] || [ ! -x bin/ffprobe ]; then
            url=https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tmp=$(mktemp -d)
            curl -fsSL --retry 3 "$url" -o "$tmp/ffmpeg.tar.xz"
            tar -xJf "$tmp/ffmpeg.tar.xz" -C "$tmp"
            dir=$(find "$tmp" -maxdepth 1 -type d -name 'ffmpeg-*-static' | head -n 1)
            install -m 755 "$dir/ffmpeg" bin/ffmpeg
            install -m 755 "$dir/ffprobe" bin/ffprobe
            rm -rf "$tmp"
          fi
          bin/ffmpeg -version | head -n 1
          EOF

      - name: Lint deployed PHP
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && find . -path './uploads' -prune -o -path './updates' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null"

      - name: Verify converter catalog
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
          set -eu
          cd "$DEPLOY_PATH"
          php -r '
            require "converter_lib.php";
            require "converter_engine.php";
            $tools = gc_conv_tools();
            $catalog = gc_conv_catalog();
            $formats = 0;
            foreach ($catalog as $group) { $formats += count($group["outputs"]); }
            echo "formats=", $formats, " ffmpeg=", ($tools["ffmpeg"] ?? "none"), PHP_EOL;
            gc_conv_do_image("assets/img/logo.png", "png", "/tmp/gc-conv-check.webp", "webp", "medium", "/tmp/gc-conv-check.log");
            echo "webp=", filesize("/tmp/gc-conv-check.webp"), " bytes", PHP_EOL;
            @unlink("/tmp/gc-conv-check.webp");
            @unlink("/tmp/gc-conv-check.log");
          '
          EOF

      - name: Verify converter under Apache
        if: env.DEPLOY_URL != ''
        run: |
          host=$(printf '%s' "$DEPLOY_URL" | sed -E 's#^https?://##; s#/.*$##')
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "HOST='$host' bash -s" <<'EOF'
          set -eu
          body=$(curl -sSk -H "Host: $HOST" 'https://127.0.0.1/converter_api.php?action=selftest')
          echo "$body"
          case "$body" in
            *'"ok":true'*) ;;
            *) echo "converter selftest failed" >&2; exit 1 ;;
          esac
          EOF

      - name: Health check
        if: env.DEPLOY_URL != ''
        run: |
          curl -fsS --retry 5 --retry-delay 3 "$DEPLOY_URL/login.php" > /dev/null
