name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          : "${SSH_HOST:?SSH_HOST secret is required}"
          : "${SSH_USER:?SSH_USER secret is required}"
          : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY secret is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy code with rsync
        run: |
          rsync -az --delete --delay-updates \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.githooks/' \
            --exclude='deploy/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='uploads/' \
            --exclude='updates/' \
            --exclude='configfile.ini' \
            --exclude='*.log' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Lint deployed PHP
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && find . -path './uploads' -prune -o -path './updates' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null"

      - name: Health check
        if: env.DEPLOY_URL != ''
        run: |
          curl -fsS --retry 5 --retry-delay 3 "$DEPLOY_URL/login.php" > /dev/null
