name: Diagnose production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect PHP and tools
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
          set +e
          echo "== whoami =="; id
          echo "== os =="; cat /etc/os-release | head -n 4; uname -m
          echo "== php =="; php -v | head -n 1
          echo "== php binary =="; php -r 'echo PHP_BINARY, PHP_EOL, PHP_BINDIR, PHP_EOL;'
          echo "== php extensions =="; php -m | tr '\n' ' '; echo
          echo "== php functions =="
          php -r 'var_dump(["exec" => function_exists("exec"), "proc_open" => function_exists("proc_open"), "gd" => function_exists("imagecreatetruecolor"), "imagick" => class_exists("Imagick")]);'
          echo "== disable_functions =="; php -r 'echo ini_get("disable_functions"), PHP_EOL;'
          echo "== limits =="; php -r 'echo "upload_max_filesize=", ini_get("upload_max_filesize"), " post_max_size=", ini_get("post_max_size"), " memory_limit=", ini_get("memory_limit"), PHP_EOL;'
          echo "== php installs =="; ls -1 /usr/bin/php* 2>/dev/null
          for p in /usr/bin/php*; do
            [ -x "$p" ] || continue
            printf '%s: ' "$p"
            "$p" -m 2>/dev/null | grep -iE 'gd|imagick' | tr '\n' ' '
            echo
          done
          echo "== web sapi =="
          ls -1 /etc/php/8.4/*/php.ini 2>/dev/null
          ps -eo comm,args 2>/dev/null | grep -E 'apache2|php-fpm' | head -n 5
          php -i 2>/dev/null | grep -E 'Server API|Loaded Configuration|user_ini'
          echo "== tools =="
          for b in ffmpeg ffprobe soffice libreoffice gs pdftoppm pdftotext pandoc tesseract ebook-convert; do
            printf '%-14s ' "$b"; command -v "$b" || echo MISSING
          done
          echo "== python =="; python3 -V 2>&1; python3 -m pip -V 2>&1
          echo "== network =="
          curl -sSI --max-time 20 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | head -n 3
          echo "== sudo =="
          sudo -n true 2>/dev/null && echo SUDO_OK || echo NO_SUDO
          echo "== disk =="; df -h /
          echo "== deploy dir =="; ls -ld "$DEPLOY_PATH" 2>&1
          echo "== deploy writable =="; test -w "$DEPLOY_PATH" && echo WRITABLE || echo NOT_WRITABLE
          echo "== done =="
          EOF
