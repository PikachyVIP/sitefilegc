name: Install converter document tools (one-off)

# Temporary, manually dispatched workflow. It installs the packages the
# converter needs on the real application host; it does not deploy code.
# Delete this file after the host has the tools.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-converter-tools.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Validate secrets
        run: |
          : "${SSH_HOST:?SSH_HOST secret is required}"
          : "${SSH_USER:?SSH_USER secret is required}"
          : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY secret is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Show target
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'id; hostname; . /etc/os-release; echo "$PRETTY_NAME"; command -v apt-get || true'

      - name: Install packages
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
          set -eu
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          test -f "$DEPLOY_PATH/converter_api.php"
          echo "target: $(hostname) $DEPLOY_PATH"
          as_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            else
              sudo -n "$@"
            fi
          }
          if [ "$(id -u)" -ne 0 ] && ! sudo -n true 2>/dev/null; then
            echo "ERROR: $USER has no passwordless sudo; root access is required." >&2
            exit 1
          fi
          as_root env DEBIAN_FRONTEND=noninteractive \
            apt-get -o DPkg::Lock::Timeout=120 update
          as_root env DEBIAN_FRONTEND=noninteractive \
            apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress \
            ghostscript poppler-utils \
            tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng \
            fonts-dejavu-core fonts-liberation
          EOF

      - name: Verify tools
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'EOF'
          set -eu
          for tool in soffice gs pdftoppm pdftotext tesseract; do
            printf '%s: ' "$tool"
            command -v "$tool"
          done
          soffice --version | head -n 1
          gs --version
          pdftoppm -v 2>&1 | head -n 1
          pdftotext -v 2>&1 | head -n 1
          tesseract --version 2>&1 | head -n 1
          echo 'Languages:'
          tesseract --list-langs 2>&1
          EOF

      - name: Check converter health
        run: |
          curl -fsS --retry 3 --retry-delay 2 \
            'https://file.grandeconfidence.ru/converter_api.php?action=health'
